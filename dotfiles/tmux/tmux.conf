# Lean, keyboard-first tmux defaults for Windows Terminal + MSYS2 UCRT64.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" \; display-message "tmux config reloaded"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#cba6f7]%H:%M "
setw -g window-status-format " #[fg=#a6adc8]#I:#W "
setw -g window-status-current-format " #[fg=#11111b,bg=#a6e3a1,bold]#I:#W#[default] "
