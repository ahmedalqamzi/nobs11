add_newline = true
command_timeout = 1200
palette = 'catppuccin_mocha'

format = """
[](surface0)\
$os\
$username\
[](bg:blue fg:surface0)\
$directory\
[](fg:blue bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface0)\
$c\
$rust\
$golang\
$nodejs\
$python\
$dotnet\
[](fg:surface0)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

[os]
disabled = false
style = 'bg:surface0 fg:text'

[os.symbols]
Windows = ' '
Arch = '󰣇 '
Ubuntu = '󰕈 '
Linux = '󰌽 '

[username]
show_always = true
style_user = 'bg:surface0 fg:text'
style_root = 'bg:surface0 fg:red'
format = '[$user ]($style)'

[directory]
style = 'bg:blue fg:crust bold'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
Documents = '󰈙 '
Downloads = ' '
Music = ' '
Pictures = ' '
Desktop = ' '

[git_branch]
symbol = ''
style = 'bg:surface1 fg:mauve'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:surface1 fg:peach'
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = ' '
style = 'bg:surface0 fg:blue'
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ' '
style = 'bg:surface0 fg:peach'
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ' '
style = 'bg:surface0 fg:blue'
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = ' '
style = 'bg:surface0 fg:green'
format = '[ $symbol($version) ]($style)'

[python]
symbol = ' '
style = 'bg:surface0 fg:yellow'
format = '[ $symbol($version) ]($style)'

[dotnet]
symbol = ' '
style = 'bg:surface0 fg:mauve'
format = '[ $symbol($version) ]($style)'

[fill]
symbol = ' '

[cmd_duration]
min_time = 1500
style = 'fg:overlay1'
format = '[󰔛 $duration]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:lavender'
format = '[ $time]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
