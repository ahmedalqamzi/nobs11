name: Feature request
description: Propose a focused, reversible workstation improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow or compatibility problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback and safety considerations
      description: Explain how the change can be previewed, reversed, and tested.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not require weakening Defender, Windows Update, UAC, VBS, exploit mitigations, or driver security.
          required: true
