name: Publish website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          repository_url="https://github.com/${GITHUB_REPOSITORY}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          site_origin="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}"
          sed -e "s|__REPO_URL__|${repository_url}|g" -e "s|__SITE_ORIGIN__|${site_origin}|g" website/index.html > _site/index.html
          cp website/styles.css website/app.js website/og.png website/.nojekyll _site/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
